name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: dotnet build ImageToAscii.sln --configuration Release
      - run: dotnet test ImageToAscii.sln --configuration Release --no-build
      - run: node --test tests/page.test.cjs
